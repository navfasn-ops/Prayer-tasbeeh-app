name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Create Android Project Structure
        run: |
          flutter create temp_app \
            --org com.prayer.tasbeeh \
            --platforms=android

          cp -r temp_app/android .
          rm -rf temp_app

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          )

          text = text.replace(
              'android:label="temp_app"',
              'android:label="Prayer &amp; Tasbeeh"'
          )

          manifest.write_text(text)
          PY

      - name: Create Keystore for App Signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias key \
            -storepass android \
            -keypass android \
            -dname "CN=PrayerApp, OU=Dev, O=Prayer, L=City, S=State, C=IN"

      - name: Configure Gradle Signings
        run: |
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=key" >> android/key.properties
          echo "storeFile=release-key.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Signed APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prayer-and-Tasbeeh-APK
          path: build/app/outputs/flutter-apk/app-release.apk
